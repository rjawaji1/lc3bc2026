name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the draft release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64
            out: lc3bc
            asset: lc3bc-x86_64-linux
          - os: ubuntu-24.04-arm
            target: linux_arm64
            out: lc3bc
            asset: lc3bc-aarch64-linux
          - os: windows-latest
            target: windows_amd64
            out: lc3bc.exe
            asset: lc3bc-x86_64-windows.exe
          # Odin has no windows_arm64 target.
          - os: macos-latest
            target: darwin_arm64
            out: lc3bc
            asset: lc3bc-aarch64-darwin
          # Intel macOS is cross-compiled; Odin only publishes an arm64 macOS build.
          - os: macos-latest
            target: darwin_amd64
            out: lc3bc
            asset: lc3bc-x86_64-darwin

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: latest

      - name: Build
        shell: bash
        run: odin build . -out:${{ matrix.out }} -target:${{ matrix.target }} -o:speed

      - name: Package
        shell: bash
        run: mv "${{ matrix.out }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: lc3bc-*
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            artifacts/*
